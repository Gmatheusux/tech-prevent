name: Deploy no Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT_NAME: tech-prevent
    steps:
      - uses: actions/checkout@v4

      # Publica apenas os arquivos do site (sem docs, .md e exports do Figma)
      - name: Montar pasta do site
        run: |
          mkdir -p dist
          cp index.html dist/
          cp *.png *.jpg *.webp dist/
          ls -la dist

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Criar projeto no Cloudflare Pages (se ainda não existir)
        run: npx --yes wrangler@3 pages project create "$PROJECT_NAME" --production-branch=master || true

      - name: Publicar
        run: npx --yes wrangler@3 pages deploy dist --project-name="$PROJECT_NAME" --branch=master
