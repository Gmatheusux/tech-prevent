<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Prevent | A Solução Definitiva em TI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@500;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1E40AF',
                        primaryDark: '#1E3A8A',
                        secondary: '#3B82F6',
                        accent: '#CC5500',
                        accentDark: '#A34300',
                        surface: '#F8FAFC',
                    },
                    fontFamily: {
                        sans: ['Open Sans', 'sans-serif'],
                        heading: ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .fade-in { animation: fadeIn 0.4s ease-in-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-surface text-[#0F172A] font-sans antialiased overflow-x-hidden">

    <!-- Navbar -->
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center gap-2 cursor-pointer" onclick="setMode('NEUTRAL')">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#1E40AF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    <path d="M12 8v8"/><path d="M8 12h8"/>
                </svg>
                <div class="flex flex-col leading-none">
                    <span class="text-xl font-black font-heading text-primary tracking-tight">TECH PREVENT</span>
                </div>
            </div>
            
            <button class="hidden md:flex items-center gap-2 px-5 py-2.5 bg-primary hover:bg-primaryDark text-white font-bold rounded-lg transition-colors text-sm">
                Área do Cliente
            </button>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="relative bg-white pt-24 pb-32 overflow-hidden border-b border-slate-200 min-h-[600px] flex items-center">
        <!-- Decorator -->
        <div class="absolute inset-0 z-0 opacity-[0.03]" style="background-image: radial-gradient(#1E40AF 2px, transparent 2px); background-size: 32px 32px;"></div>
        
        <div class="max-w-7xl mx-auto px-6 relative z-10 w-full flex flex-col lg:flex-row items-center justify-center lg:justify-between gap-16">
            
            <!-- Texto Dinâmico -->
            <div id="hero-content" class="fade-in max-w-2xl text-center lg:text-left flex-1">
                <!-- Injected via JS -->
            </div>

            <!-- Imagem Dinâmica (Oculta no Neutro, Exibida nos funis) -->
            <div id="hero-image-container" class="fade-in relative w-full lg:w-1/2 h-[450px] bg-slate-100 rounded-3xl overflow-hidden shadow-2xl border-4 border-white hidden lg:flex items-center justify-center">
                <img id="hero-img" src="" alt="Tech Prevent" class="absolute inset-0 w-full h-full object-cover opacity-90 transition-opacity duration-500">
            </div>
            
        </div>
    </section>

    <!-- Logic -->
    <script>
        const contentNeutral = `
            <h1 class="text-5xl lg:text-6xl font-black font-heading text-primary leading-[1.15] mb-6">
                A solução definitiva em TI, moldada para a sua realidade.
            </h1>
            <p class="text-lg lg:text-xl text-slate-600 mb-10 leading-relaxed max-w-xl mx-auto lg:mx-0">
                Selecione o seu perfil abaixo para um atendimento transparente, rápido e sem surpresas.
            </p>
            <div class="flex flex-col sm:flex-row items-center gap-4 justify-center lg:justify-start">
                <button onclick="setMode('B2B')" class="w-full sm:w-auto px-8 py-4 bg-accent hover:bg-accentDark text-white font-bold rounded-xl shadow-lg transition-transform transform hover:-translate-y-0.5 text-lg">
                    Para Minha Empresa
                </button>
                <button onclick="setMode('B2C')" class="w-full sm:w-auto px-8 py-4 bg-primary hover:bg-primaryDark text-white font-bold rounded-xl shadow-lg transition-transform transform hover:-translate-y-0.5 text-lg">
                    Para Uso Pessoal
                </button>
            </div>
        `;

        const contentB2B = `
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-accent/10 text-accent font-bold text-sm mb-6 border border-accent/20">
                <span class="w-2 h-2 rounded-full bg-accent animate-pulse"></span>
                Perfil: Empresas
            </div>
            <h1 class="text-5xl lg:text-6xl font-black font-heading text-primary leading-[1.1] mb-6">
                TI Corporativa com <span class="text-accent underline decoration-4 underline-offset-4">Escalabilidade</span> e Segurança.
            </h1>
            <p class="text-lg text-slate-600 mb-8 leading-relaxed">
                Da infraestrutura de redes ao Service Desk completo. Prevenimos problemas antes que eles parem a sua operação.
            </p>
            <div class="flex flex-wrap items-center gap-4 justify-center lg:justify-start">
                <button class="px-8 py-4 bg-accent hover:bg-accentDark text-white font-bold rounded-xl shadow-lg transition-transform transform hover:-translate-y-0.5 flex items-center gap-2">
                    Realize sua cotação
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                </button>
                <button onclick="setMode('NEUTRAL')" class="px-8 py-4 text-slate-500 font-bold hover:text-slate-800 transition-colors">
                    Voltar
                </button>
            </div>
            <div class="mt-10 flex flex-wrap items-center gap-6 text-sm font-bold text-slate-500 justify-center lg:justify-start">
                <div class="flex items-center gap-2"><svg width="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg> Gestão de Ativos & Segurança</div>
                <div class="flex items-center gap-2"><svg width="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg> Suporte Preventivo N1, N2 e N3</div>
            </div>
        `;

        const contentB2C = `
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-primary/10 text-primary font-bold text-sm mb-6 border border-primary/20">
                <svg width="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                Perfil: Uso Pessoal
            </div>
            <h1 class="text-5xl lg:text-6xl font-black font-heading text-primary leading-[1.1] mb-6">
                Reparo de Computadores com <span class="text-secondary underline decoration-4 underline-offset-4">100% de Transparência</span>.
            </h1>
            <p class="text-lg text-slate-600 mb-8 leading-relaxed">
                Conheça a metodologia "Caixa de Vidro". Acompanhe cada etapa do conserto do seu equipamento, direto pelo WhatsApp.
            </p>
            <div class="flex flex-wrap items-center gap-4 justify-center lg:justify-start">
                <button class="px-8 py-4 bg-primary hover:bg-primaryDark text-white font-bold rounded-xl shadow-lg transition-transform transform hover:-translate-y-0.5 flex items-center gap-2">
                    Solicitar Diagnóstico Agora
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                </button>
                <button onclick="setMode('NEUTRAL')" class="px-8 py-4 text-slate-500 font-bold hover:text-slate-800 transition-colors">
                    Voltar
                </button>
            </div>
            <div class="mt-10 flex flex-wrap items-center gap-6 text-sm font-bold text-slate-500 justify-center lg:justify-start">
                <div class="flex items-center gap-2"><svg width="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg> Laboratório Físico no RJ</div>
                <div class="flex items-center gap-2"><svg width="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg> Sistema Leva & Traz Exclusivo</div>
            </div>
        `;

        function setMode(mode) {
            const content = document.getElementById('hero-content');
            const imgContainer = document.getElementById('hero-image-container');
            const img = document.getElementById('hero-img');

            // Reset Animation
            content.classList.remove('fade-in');
            if (!imgContainer.classList.contains('hidden')) imgContainer.classList.remove('fade-in');
            void content.offsetWidth; // trigger reflow
            content.classList.add('fade-in');

            if (mode === 'NEUTRAL') {
                content.innerHTML = contentNeutral;
                imgContainer.classList.add('hidden'); // Oculta imagem no neutro
                content.classList.remove('lg:text-left');
                content.classList.add('text-center');
            } else if (mode === 'B2B') {
                content.innerHTML = contentB2B;
                imgContainer.classList.remove('hidden');
                imgContainer.classList.add('fade-in');
                content.classList.remove('text-center');
                content.classList.add('lg:text-left');
                img.src = "https://images.unsplash.com/photo-1558494949-ef010cbdcc31?auto=format&fit=crop&w=800&q=80";
            } else if (mode === 'B2C') {
                content.innerHTML = contentB2C;
                imgContainer.classList.remove('hidden');
                imgContainer.classList.add('fade-in');
                content.classList.remove('text-center');
                content.classList.add('lg:text-left');
                img.src = "https://images.unsplash.com/photo-1597872200969-2b65d56bd16b?auto=format&fit=crop&w=800&q=80";
            }
        }

        // Initialize NEUTRAL
        document.addEventListener('DOMContentLoaded', () => setMode('NEUTRAL'));
    </script>
</body>
</html>
